# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-latest ]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install aimfast with test dependencies
        run: |
          uv sync --group tests --extra all
          uv pip install -U --force-reinstall "breizorro[all] @ git+https://github.com/ratt-ru/breizorro.git@updates"

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run flake8 aimfast --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run flake8 aimfast --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test command
        run: uv run aimfast -h

      - name: Run testsuite
        run: uv run pytest -vvv aimfast/

      - name: Download test dataset
        run: |
          curl --fail --retry 3 --retry-delay 5 -L -o mypipelinerun_circinus_p3_3-MFS-image.tar "https://www.dropbox.com/scl/fi/xoaqth4jhjnx098xbegvn/mypipelinerun_circinus_p3_3-MFS-image.tar?rlkey=vdgkz2xpjgpp7v7hjxm7kg6g2&st=isg70eve&dl=1"
          tar -xvf mypipelinerun_circinus_p3_3-MFS-image.tar

      - name: Run source-finder end-to-end tests
        run: |
          uv run aimfast source-finder -gc my-source-finder.yml
          for sf in pybdsf aegean breizorro; do
            uv run aimfast source-finder -c my-source-finder.yml -sf "$sf" -r mypipelinerun_circinus_p3_3-MFS-image.fits --threshold 10 --ncpu 1
          done
          cat mypipelinerun_circinus_p3_3-MFS-image_aegean_isle.tab
          cat mypipelinerun_circinus_p3_3-MFS-image-breizorro.txt
          cat mypipelinerun_circinus_p3_3-MFS-image-pybdsf.txt

      - name: Run compare-images test
        run: |
          uv run aimfast --compare-images mypipelinerun_circinus_p3_3-MFS-image.fits mypipelinerun_circinus_p3_3-MFS-image.fits --html-prefix cluster --units milli -x-size 16pt -y-size 16pt -title-size 28pt -legend-size 16pt -x-maj-size 16pt -y-maj-size 16pt -bar-size 16pt -bar-major-size 14pt -units micro
          find . -name '*.html' -o -name '*.lsm.html'

      - name: Run compare-models test
        run: |
          uv run aimfast --compare-models mypipelinerun_circinus_p3_3-MFS-image-pybdsf.txt mypipelinerun_circinus_p3_3-MFS-image-breizorro.txt -tol 6

      - name: Upload HTML artifacts
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: html-artifacts
          path: |
            *.html
            **/*.lsm.html
          if-no-files-found: warn