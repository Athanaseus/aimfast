# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
formats: all

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # Install uv instead of poetry
      - pip install uv
    post_install:
      # uv sync has no --system flag (that belongs to uv pip install, a
      # different command family); it always manages its own project
      # venv. Point it at RTD's own pre-created virtualenv instead of
      # letting it create a separate one, so the sphinx-build step below
      # (which runs in RTD's venv) can actually see the installed
      # packages. --group docs ensures the documentation tools are
      # included.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs

