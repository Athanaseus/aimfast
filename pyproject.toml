[project]
name = "aimfast"
version = "1.4.0"
description = "An Astronomical Image Fidelity Assessment Tool."
authors = [
    { name = "Athanaseus Ramaila", email = "ramaila.jat@gmail.com" }
]
readme = "README.rst"
license = { text = "GNU GPL v3" }
requires-python = ">=3.9,<3.14"
keywords = ["fits", "dataset", "lsm", "models", "statistics", "html", "catalogs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries"
]
dependencies = [
    "astLib>=0.10.0",
    "astropy",
    "astroquery",
    "astro-tigger",
    "bokeh",
    "jsonschema",
    "mock",
    "numpy",
    "numpydoc",
    "pyyaml",
    "regions",
    "scikit-learn",
    "scipy"
]

[project.optional-dependencies]
aegean = ["AegeanTools"]
pybdsf = ["bdsf", "matplotlib"]
source_finders = ["bdsf", "matplotlib", "AegeanTools", "breizorro"]
svg_images = ["matplotlib", "selenium"]
all = ["AegeanTools", "bdsf", "matplotlib", "selenium", "breizorro"]

[project.urls]
Homepage = "https://github.com/Athanaseus/aimfast"
Repository = "https://github.com/Athanaseus/aimfast.git"

[project.scripts]
aimfast = "aimfast.main:driver"

[dependency-groups]
tests = [
    "pytest>=7.2.2",
    "pytest-flake8>=1.1.1",
    "pytest-cov",
    "flake8",
    "attrs",
    "numpy"
]
docs = [
    "Sphinx>=5.3.0",
    "sphinx-pypi-upload",
    "sphinx-copybutton>=0.5.0",
    "furo>=2022.9.15",
    "numpydoc"
]

[tool.uv]
default-groups = ["tests", "docs"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
